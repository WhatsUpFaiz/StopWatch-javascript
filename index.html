<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Stopwatch</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: #000;
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: url('/StopWatch-javascript/stopwatch image.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
        }

        .stopwatch-container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 1rem;
        }

        .stopwatch {
            font-size: clamp(2rem, 10vw, 5rem);
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem 2rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
            animation: glow 1.5s ease-in-out infinite;
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            font-size: clamp(0.875rem, 4vw, 1.25rem);
            padding: 0.75em 1.5em;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            }
            50% {
                box-shadow: 0 0 40px rgba(255, 255, 255, 0.4);
            }
        }

        @media (max-width: 480px) {
            .stopwatch {
                padding: 0.75rem 1.5rem;
            }
            
            .controls {
                gap: 0.5rem;
            }
            
            .btn {
                padding: 0.5em 1em;
            }
        }
    </style>

    <div class="container">
        <div class="overlay"></div>
        <div class="stopwatch-container">
            <div class="stopwatch" id="stopwatch">00:00:000</div>
            <div class="controls">
                <button class="btn" id="start" onclick="start()">Start</button>
                <button class="btn" id="stop" onclick="stop()">Stop</button>
                <button class="btn" id="reset" onclick="reset()">Reset</button>
            </div>
        </div>
    </div>

    <script>
        let min = 0;
        let sec = 0;
        let ms = 0;
        let interval;

        function start() {
            if (!interval) {
                interval = setInterval(updateStopwatch, 10);
                document.getElementById('start').disabled = true;
            }
        }

        function stop() {
            clearInterval(interval);
            interval = null;
            document.getElementById('start').disabled = false;
        }

        function reset() {
            stop();
            min = 0;
            sec = 0;
            ms = 0;
            updateDisplay();
        }

        function updateStopwatch() {
            ms += 10;
            if (ms >= 1000) {
                ms = 0;
                sec++;
            }
            if (sec >= 60) {
                sec = 0;
                min++;
            }
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('stopwatch').textContent = 
                `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}:${String(ms).padStart(3, '0')}`;
        }
    </script>
</body>
</html>
